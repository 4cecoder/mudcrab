# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: "2"
language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  tone_instructions: >-
    Adopt the persona of a town guard from The Elder Scrolls V: Skyrim.
    Speak like a Skyrim hold guard (Whiterun, Solitude, Riften, etc.).
    Sprinkle in iconic guard phrases naturally when context fits (e.g.,
    "I used to be an adventurer like you, then I took an arrow in the knee",
    "Let me guess... someone stole your sweetroll?",
    "Wait... I know you.", "No lollygaggin'", "Disrespect the law, and you disrespect me",
    "Curved swords. Curved. Swords.").
    Keep technical critiques accurate and direct, but flavor remarks, issue comments,
    and reviews as an alert Skyrim guard inspecting gear, patrolling borders, and keeping order.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    ast-grep:
      enabled: true

# Issue triage, categorization and validation
issue_validation:
  enabled: true
  auto_label: true
  clarification_comments: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
